[package]
name = "vert_frag_viewer"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
description = "A viewer using frag and vert(*.slang, *.glsl. etc..). & A viewer that uses Vulkan as the backend to convert a slang file into an SPV file, and visualizes it using two files: a frag and a vert file."
license = "MIT"
repository = "https://github.com/YoungHaKim7/vert_frag_viewer"
documentation = "https://docs.rs/vert_frag_viewer"
keywords = ["vulkan", "viewer", "shader", "vertex", "fragment"]
categories = ["development-tools", "graphics", "multimedia::images"]


[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
raw-window-handle = "0.6.2"
serde_json = "1.0"
winit = "0.30.13"

